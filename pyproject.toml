[project]
name = "voicecode"
version = "0.1.0"
description = "Full-duplex Discord voice frontend for a running Claude Code session"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }

# Python is pinned to exactly 3.12: kokoro requires <3.13, nemo-toolkit 3.0 requires
# >=3.12. 3.12 is the only version satisfying both. See docs/DESIGN.md 1.6.
dependencies = [
    # discord.py 2.7+ is REQUIRED, not merely preferred: it carries DAVE (E2EE) support
    # via the `davey` native module. Discord enforced DAVE for non-Stage voice on
    # 2026-03-02 and rejects non-compliant clients with close code 4017.
    "discord.py[voice]>=2.7.1,<3",
    # Pinned exactly. This extension is experimental, its last commit is 2025-06-18,
    # and it has no DAVE support -- we supply the missing decryption ourselves in
    # voicecode/audio/dave.py. Do not float this pin without re-reading that module.
    "discord-ext-voice-recv==0.5.2a179",
    "pynacl>=1.5.0,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "numpy>=2.0,<3",
    "soxr>=1.0,<2",
    "silero-vad>=5.1,<7",
    "torch>=2.4",
    "kokoro>=0.9.4,<0.10",
    "misaki[en]>=0.9.4",
]

[project.optional-dependencies]
# The default ASR backend (nvidia/parakeet-unified-en-0.6b) needs NeMo. It is a large
# install and its 3.0 API surface for this model is unverified upstream, so it is an
# extra rather than a hard dependency -- the rest of the bot installs and self-tests
# without it. See README "Installing the ASR backend".
nemo = ["nemo-toolkit[asr]>=3.0.0"]
# Alternative backend: nvidia/parakeet-tdt-0.6b-v3 loads via transformers AutoModel.
hf = ["transformers>=4.48", "librosa>=0.10"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
voicecode = "voicecode.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicecode"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
